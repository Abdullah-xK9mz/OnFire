<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ON FIRE educational platform"><title>إدارة الاشتراكات | ON FIRE</title><style>
:root{--bg:#f7f7f8;--surface:#fff;--text:#151515;--muted:#6b6b72;--line:#e7e7ea;--fire:#ff4b16;--fire2:#ff7a18;--shadow:0 14px 45px rgba(0,0,0,.08);--radius:20px;--success:#1d9b65;--danger:#d92d20;--warn:#b7791f}

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;direction:rtl;line-height:1.65}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.container{width:min(1180px,92%);margin:auto}.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{height:72px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}.brand img{width:42px;height:42px;object-fit:contain}.brand .fire{color:var(--fire)}.navlinks{display:flex;gap:6px;align-items:center;flex:1}.navlinks a,.navlinks button{padding:9px 12px;border-radius:12px;background:transparent;color:var(--muted)}.navlinks a:hover,.navlinks button:hover{background:var(--bg);color:var(--text)}.actions{display:flex;gap:8px;align-items:center}.iconbtn,.themebtn{width:42px;height:42px;border-radius:12px;background:var(--bg);color:var(--text);border:1px solid var(--line)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 17px;border-radius:13px;font-weight:800;transition:.2s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;box-shadow:0 10px 25px rgba(255,75,22,.2)}.btn-secondary{background:var(--surface);border:1px solid var(--line);color:var(--text)}.btn-danger{background:var(--danger);color:#fff}.btn-success{background:var(--success);color:#fff}.btn-sm{padding:8px 11px;font-size:13px}.hero{padding:75px 0 50px}.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:35px;align-items:center}.eyebrow{display:inline-flex;padding:7px 11px;border-radius:999px;background:rgba(255,75,22,.1);color:var(--fire);font-weight:900}.hero h1{font-size:clamp(38px,6vw,70px);line-height:1.05;margin:18px 0}.hero p{font-size:18px;color:var(--muted);max-width:680px}.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}.fire-orb{height:300px;border-radius:26px;background:radial-gradient(circle at 50% 35%,#ffb35c 0,#ff4b16 28%,#531006 60%,#17100d 100%);display:grid;place-items:center;overflow:hidden;position:relative}.fire-orb:after{content:"🔥";font-size:100px;filter:drop-shadow(0 10px 30px #ffb35c);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px) scale(1.04)}}.section{padding:42px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:22px}.section h2{margin:0;font-size:30px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 6px 25px rgba(0,0,0,.035)}.card h3{margin:0 0 7px}.card p{margin:5px 0;color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--bg);border:1px solid var(--line)}.badge.fire{background:rgba(255,75,22,.1);color:var(--fire);border-color:rgba(255,75,22,.18)}.badge.success{color:var(--success);background:rgba(29,155,101,.1)}.badge.warn{color:var(--warn);background:rgba(183,121,31,.1)}.badge.danger{color:var(--danger);background:rgba(217,45,32,.1)}.progress{height:9px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--line)}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--fire),var(--fire2));border-radius:inherit}.form{display:grid;gap:14px}.field{display:grid;gap:7px}.field label{font-weight:800}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--fire);box-shadow:0 0 0 3px rgba(255,75,22,.1)}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:30px}.auth{width:min(470px,100%);background:var(--surface);border:1px solid var(--line);border-radius:25px;padding:30px;box-shadow:var(--shadow)}.auth .brand{justify-content:center;margin-bottom:22px}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:center;font-weight:800}.choice.active{border-color:var(--fire);background:rgba(255,75,22,.08);color:var(--fire)}.dashboard{padding:30px 0}.page-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat strong{font-size:30px;display:block}.stat span{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:260px 1fr;gap:20px}.sidebar{position:sticky;top:92px;height:max-content}.side a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:var(--muted)}.side a:hover,.side a.active{background:rgba(255,75,22,.1);color:var(--fire);font-weight:800}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:13px;color:var(--muted)}.video{background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;color:#fff}.video video{width:100%;height:100%;display:block}.lesson-layout{display:grid;grid-template-columns:1fr 310px;gap:20px}.list{display:grid;gap:8px}.list a,.list button{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:right;color:var(--text)}.list a.locked{opacity:.55}.toast{position:fixed;bottom:22px;left:22px;z-index:100;background:#171717;color:#fff;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);display:none}.toast.show{display:block;animation:toast .25s ease}@keyframes toast{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}.empty{padding:45px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;place-items:center;padding:20px}.modal.open{display:grid}.modal-box{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:20px;padding:22px}.footer{padding:40px 0;border-top:1px solid var(--line);margin-top:30px}.notice{padding:14px 16px;border-radius:14px;background:rgba(255,75,22,.08);border:1px solid rgba(255,75,22,.15)}.danger-box{padding:14px 16px;border-radius:14px;background:rgba(217,45,32,.08);color:var(--danger);border:1px solid rgba(217,45,32,.15)}.success-box{padding:14px 16px;border-radius:14px;background:rgba(29,155,101,.08);color:var(--success);border:1px solid rgba(29,155,101,.15)}.search{position:relative}.search input{padding-right:42px}.search span{position:absolute;right:13px;top:11px}.chips{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;gap:8px;align-items:center}.check input{width:18px;height:18px}.certificate{max-width:850px;margin:30px auto;padding:50px;border:8px double var(--fire);background:var(--surface);text-align:center;box-shadow:var(--shadow)}.certificate .seal{font-size:45px}.chart{height:240px;display:flex;align-items:end;gap:10px;padding:20px}.bar{flex:1;background:linear-gradient(180deg,var(--fire2),var(--fire));border-radius:8px 8px 2px 2px;min-height:8px}.bar-label{font-size:11px;color:var(--muted);text-align:center}.mobile-menu{display:none}
@media(max-width:900px){.hero-grid,.lesson-layout,.layout{grid-template-columns:1fr}.sidebar{position:static}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.navlinks{display:none}.mobile-menu{display:block}.nav.open .navlinks{display:flex;position:absolute;top:72px;right:4%;left:4%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;flex-direction:column;align-items:stretch;box-shadow:var(--shadow)}}
@media(max-width:600px){.grid,.grid-2,.stats,.choice-grid{grid-template-columns:1fr}.hero{padding-top:45px}.hero h1{font-size:43px}.container{width:min(94%,1180px)}.card{padding:16px}.certificate{padding:25px;border-width:5px}.nav{height:64px}.brand img{width:36px;height:36px}}
</style></head><body><header class="topbar"><div class="container nav"><button class="iconbtn mobile-menu" id="menuBtn">☰</button><a class="brand" href="index.html"><img src="assets/logo.png" alt="ON FIRE"><span>ON <span class="fire">FIRE</span></span></a><nav class="navlinks"><a href="dashboard.html">الرئيسية</a><a href="courses.html">المواد</a><a href="notifications.html">الإشعارات</a><a href="profile.html">حسابي</a></nav><div class="actions"><button class="themebtn" id="themeBtn">🌙</button><button class="btn btn-secondary btn-sm" id="logoutBtn" style="display:none">خروج</button></div></div></header><main class="dashboard"><div class="container"><div class="page-title"><div><span class="eyebrow">Admin</span><h1>إدارة الاشتراكات</h1></div><button id="newBtn" class="btn btn-primary">+ إضافة</button></div><div id="list" class="card table-wrap"></div></div><div id="modal" class="modal"><div class="modal-box"><h2>إضافة / تعديل</h2><form id="form" class="form"><div class="field"><label>الطالب</label><input id="studentId" ></div><div class="field"><label>الخطة</label><input id="plan" ></div><div class="field"><label>الحالة</label><input id="status" ></div><div class="field"><label>النهاية</label><input id="endAt" ></div><button class="btn btn-primary">حفظ</button></form></div></div></main><footer class="footer"><div class="container muted" style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap"><span>🔥 ON FIRE — منصة السنتر التعليمية</span><span>تعلم • اختبر • تقدّم</span></div></footer><div id="toast" class="toast"></div><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithRedirect, getRedirectResult, updateProfile } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection, query, where, orderBy, limit, getDocs, onSnapshot, serverTimestamp, Timestamp, runTransaction } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-functions.js";

const firebaseConfig = {
  apiKey: "AIzaSyCyqJze1z59hYvsuI7eZxuH9uzn3I54me0",
  authDomain: "on-fire-354ed.firebaseapp.com",
  databaseURL: "https://on-fire-354ed-default-rtdb.firebaseio.com",
  projectId: "on-fire-354ed",
  storageBucket: "on-fire-354ed.firebasestorage.app",
  messagingSenderId: "965474894729",

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const functions = getFunctions(app, "us-central1");
const $ = (s, r=document)=>r.querySelector(s);
const $$ = (s, r=document)=>[...r.querySelectorAll(s)];
function toast(msg){const t=$('#toast');if(!t)return; t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function theme(){const saved=localStorage.getItem('onfire-theme')||'light';document.documentElement.dataset.theme=saved;const b=$('#themeBtn');if(b)b.textContent=saved==='dark'?'☀️':'🌙'}
function toggleTheme(){const n=(document.documentElement.dataset.theme||'light')==='dark'?'light':'dark';localStorage.setItem('onfire-theme',n);theme()}
function setupUI(){theme();$('#themeBtn')?.addEventListener('click',toggleTheme);$('#menuBtn')?.addEventListener('click',()=>$('.nav')?.classList.toggle('open'));}
function userDoc(uid){return doc(db,'users',uid)}
async function currentProfile(){const u=auth.currentUser;if(!u)return null;const s=await getDoc(userDoc(u.uid));return s.exists()?{uid:u.uid,...s.data()}:null}
function guard({roles=[],redirect='login.html'}={}){onAuthStateChanged(auth,async u=>{if(!u){location.href=redirect;return}if(roles.length){const p=await currentProfile();if(!p||!roles.includes(p.role)){location.href='dashboard.html';return}}});}
function go(url){location.href=url}
function money(n){return new Intl.NumberFormat('ar-EG',{style:'currency',currency:'EGP',maximumFractionDigits:0}).format(Number(n)||0)}
function fmtDate(v){if(!v)return '—';const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleDateString('ar-EG')}
function statusBadge(s){const m={ACTIVE:'success',APPROVED:'success',PASSED:'success',PENDING:'warn',AI_REVIEW:'warn',MANUAL_REVIEW:'warn',REJECTED:'danger',EXPIRED:'danger',LOCKED:'danger'};return `<span class="badge ${m[s]||''}">${s||'—'}</span>`}
async function call(name,data={}){const fn=httpsCallable(functions,name);const r=await fn(data);return r.data}
async function signOutNow(){await signOut(auth);go('index.html')}
setupUI();
onAuthStateChanged(auth,u=>{{const b=$("#logoutBtn");if(b)b.style.display=u?"inline-flex":"none";b?.addEventListener("click",signOutNow);}});

guard({roles:['admin']});const col='subscriptions';async function load(){const s=await getDocs(query(collection(db,col),limit(100)));$('#list').innerHTML=s.empty?'<div class="empty">لا توجد بيانات.</div>':`<table class="table"><thead><tr><th>الطالب</th><th>الخطة</th><th>الحالة</th><th>النهاية</th><th>الإجراء</th></tr></thead><tbody>${s.docs.map(d=>{const x=d.data();return `<tr><td>${x.studentId??"—"}</td><td>${x.plan??"—"}</td><td>${x.status??"—"}</td><td>${x.endAt??"—"}</td><td><button class="btn btn-sm btn-danger" data-del="${d.id}">حذف</button></td></tr>`}).join('')}</tbody></table>`;$$('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف العنصر؟')){await call('adminDelete',{collection:col,id:b.dataset.del});load()}})}$('#newBtn').onclick=()=>$('#modal').classList.add('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};$('#form').onsubmit=async e=>{e.preventDefault();try{const data={studentId: $('#studentId').value.trim(), plan: $('#plan').value.trim(), status: $('#status').value.trim(), endAt: $('#endAt').value.trim()};await call('adminCreate',{collection:col,data});$('#modal').classList.remove('open');e.target.reset();load()}catch(err){toast(err.message||'تعذر الحفظ')}};load();</script></body></html>
